        for the alert rules.
      operationId: deleteAlertRules
      requestBody:
        $ref: "#/components/requestBodies/DeleteAlertRuleRequestBody"
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                successfulIds:
                - 48
                - 49
                - 50
                errorIds:
                - 100
              schema:
                $ref: "#/components/schemas/deleteAlertRules_200_response"
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            Date:
              $ref: "#/components/headers/Date"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listAlertRules_400_response"
          description: Bad Request
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            Date:
              $ref: "#/components/headers/Date"
