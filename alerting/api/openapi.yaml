          $ref: "#/components/headers/Date"
  schemas:
    pattern_search:
      description: "Provide a search pattern to query for by the alert name, alert\
        \ rule name, or alert rule category name."
      example: Network Tunnel
      type: string
    created_after:
      description: |-
        Filter for the alerts in the collection that the system created after the timestamp.
        Provide a date and time (ISO 8601) using the YYYY-MM-DD HH:MM:SS format.
        **Note:** You cannot use the `created_after` query parameter with the `time_range` filter.
      example: 2024-01-01T00:00:00Z
      format: date-time
      type: string
    only_active_alerts_count:
      default: false
      description: Specify whether to query for the count of the active alerts only.
      example: true
      type: boolean
    entity_ids_alert_rules:
      description: The list of identifiers used by the system to update the alert
        rules.
      example:
      - 1
      - 2
      items:
        description: The identifier of the alert rule. The system uses this identifier
          to update the alert rule.
        example: 1
        type: integer
      maxItems: 100
      minItems: 1
      type: array
    entity_ids_alerts:
      description: The list of identifiers used by the system to update the alerts.
      example:
      - 1adf
      - 2eed
      items:
        description: The identifier of the alert. The system uses this identifier
          to update the alert.
        example: 1abc
        type: string
      maxItems: 100
      minItems: 1
      type: array
    success:
      description: |-
        Specifies whether the system completed all operations successfully.
        If any ID is invalid, the system is unable to complete the operation.
      example: true
      type: boolean
    successfulIdsUpdateInteger:
      description: The list of IDs for the alert rules that the system updated.
      example:
      - 1234
      items:
        description: The ID of the alert rule that the system updated.
        example: 1234
        type: integer
      type: array
    successfulIdsUpdateString:
      description: The list of IDs for the alert rules that the system updated.
      example:
      - AL-2048-833125-1764567890123-3f9a1c4b2d7e8f01
      items:
        description: The ID of the alert rule that the system updated.
        example: AL-2048-833125-1764567890123-3f9a1c4b2d7e8f01
        type: string
      type: array
    successfulIdsDelete:
      description: The list of IDs for the alert rules that the system deleted.
      example:
      - 1
      - 2
      - 3
      - 4
      items:
        description: The ID of the alert rule that the system deleted.
        type: integer
      type: array
    errorIdsString:
      description: The list of unique identifiers that either do no exist or the system
        failed to delete or update.
      example:
      - 100a
      items:
        description: The unique identifier of the alert rule that does not exist or
          the system failed to delete or update.
        example: 100a
        type: string
      type: array
    errorIdsInteger:
      description: The list of unique identifiers that either do no exist or the system
        failed to delete or update.
      example:
      - 100
      items:
        description: The unique identifier of the alert rule that does not exist or
          the system failed to delete or update.
        example: 100
        type: integer
      type: array
    createdAtAlertRule:
      description: The time and date (ISO 8601 timestamp) when the system created
        the alert rule.
      example: 2025-01-01T00:00:00Z
      format: date-time
      type: string
    modifiedAtAlertRule:
      description: The time and date (ISO 8601 timestamp) when the system last modified
        the alert rule.
      example: 2025-01-01T00:00:00Z
      format: date-time
      type: string
    createdAtAlert:
      description: The time and date (ISO 8601 timestamp) when the system created
        the alert.
      example: 2025-01-01T00:00:00Z
      format: date-time
      type: string
    modifiedAtAlert:
      description: The time and date (ISO 8601 timestamp) when the system last modified
        the alert.
      example: 2025-01-01T00:00:00Z
      format: date-time
      type: string
    include_context:
      default: false
      description: Include the context field in each alert response. The context contains
        additional metadata about the alert.
      example: true
      type: boolean
    time_range:
      description: The start and end times that the system uses to filter the alerts
        in the collection.
      example:
        start_time: 2024-01-01 00:00:00
        end_time: 2024-12-31 23:59:59
      properties:
        start_time:
          description: |-
            The time and date (ISO 8601 timestamp) that begins the time range. The system uses
            the time range to filter for alerts in the collection.
            Use the 'YYYY-MM-DD HH:MM:SS' format.
          format: date-time
          type: string
        end_time:
          description: |-
            The time and date (ISO 8601 timestamp) that ends the time range. The system uses
            the time range to filter for alerts in the collection.
            Use the 'YYYY-MM-DD HH:MM:SS' format.
          format: date-time
          type: string
      type: object
    event_time:
      description: The date and time (ISO 8601 timestamp) when the system recorded
        the event.
      example: 2024-10-22T10:30:00Z
      format: date-time
      type: string
    idAlert:
      description: The unique identifier of the alert.
      example: AL-2048-833125-1764567890123-3f9a1c4b2d7e8f01
      type: string
    idAlertRule:
      description: The unique identifier of the alert rule.
      example: 42
      type: integer
    idRule:
      description: The unique identifier of the associated rule.
      example: 42
      type: integer
    nameAlertRule:
      description: The unique name of the alert rule.
      example: Production VPN Tunnel Alert
      maxLength: 255
      type: string
    nameAlert:
      description: The name of the alert.
      example: Production VPN Tunnel Alert
      type: string
    organizationId:
      description: The unique identifier of the organization.
      example: 12345
      type: integer
    descriptionAlertRule:
      description: The description of the alert rule.
      example: Alert when production VPN tunnel disconnects
      maxLength: 100
      type: string
    descriptionAlert:
      description: The description of the alert.
      example: Alert when SFO-11 Group connectivity is lost
      type: string
    ruleTypeId:
      description: |-
        The identifier of the rule type.

        **Category: Connectivity**

        | Rule Type ID | Rule Type Name |
        | --- | --- |
        | 1 | Network tunnel group disconnected |
        | 2 | No traffic through network tunnel group |

        **Category: API Anomalies**

        | Rule Type ID | Rule Type Name |
        | --- | --- |
        | 3 | Too many requests to get an access token |
        | 4 | High percentage of API errors |
        | 5 | Large number of rate limit errors |
        | 6 | More than one client using an API credential |
        | 7 | Authentication failures |
        | 8 | Programmatic creation of more than one API credential |

        **Category: Data Usage**

        | Rule Type ID | Rule Type Name |
        | --- | --- |
        | 9 | Data usage approaching limit |

        **Category: Access Rule Changes**

        | Rule Type ID | Rule Type Name |
        | --- | --- |
        | 10 | Rule creation, deletion, changing or reordering |

        **Category: Behavior Analytics**

        | Rule Type ID | Rule Type Name |
        | --- | --- |
        | 11 | Impossible travel detected |
        | 12 | Bulk upload operations |
        | 13 | Bulk download operations |
        | 14 | Bulk delete operations |
        | 15 | DLP violation spike |
        | 16 | Upload from high-risk countries |
        | 17 | Upload to high-risk countries |
      example: 1
      type: integer
    severityAlert:
      description: |-
        The severity of the alert. The supported severity levels are:
        - 1 (High)
        - 2 (Medium)
        - 3 (Low)
        - 4 (Info)
      enum:
      - 1
      - 2
      - 3
      - 4
      example: 1
      type: integer
    statusAlertRule:
      description: |-
        The status of the alert rule. The supported status types are:
        - 1 (Enabled)
        - 2 (Disabled)
      enum:
      - 1
      - 2
      example: 1
      type: integer
    statusAlert:
      description: |-
        The status of the alert. The supported status types are:
        - 1 (Active)
        - 2 (Dismissed)
        - 3 (Resolved)
        - 4 (Archived)
      enum:
      - 1
      - 2
      - 3
      - 4
      example: 1
      type: integer
    totalAlerts:
      description: The total number of active alerts.
      example: 100
      type: integer
    notificationTypeEmail:
      description: The type of the notification.
      enum:
      - email
      example: email
      type: string
    notificationTypeAll:
      description: The type of the notification for the alert rule.
      enum:
      - email
      - webhook
      example: webhook
      type: string
    notificationInfoAlertRule:
      description: The properties of the notification for the alert rule.
      example:
        webhook_ids:
        - 1abcde
        - 1abcde
        recipients:
        - admin@company.com
        - ops@company.com
        type: webhook
      properties:
        type:
          $ref: "#/components/schemas/notificationTypeAll"
        recipients:
          description: The list of email recipients configured in the alert rule to
            receive the notification.
          example:
          - admin@company.com
          - ops@company.com
          items:
            description: An email recipient for the notification.
            format: email
            type: string
          maxItems: 50
          minItems: 1
          type: array
        webhook_ids:
          description: The list of unique identifiers for the Webhooks configured
            on the alert rule.
          items:
            description: The unique identifier for the Webhook ID.
            example: 1abcde
            type: string
          type: array
      type: object
    conditionsAlertRule:
