            Content-Type:
              $ref: "#/components/headers/Content-Type"
            Date:
              $ref: "#/components/headers/Date"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listAlertRules_500_response"
          description: Internal Server Error
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            Date:
              $ref: "#/components/headers/Date"
      security:
      - oauthFlow:
        - admin.alertrules:write
      summary: Delete Alert Rules
      tags:
      - Alert Rules
    get:
      description: Get the alert rules for the organization.
      operationId: listAlertRules
      responses:
