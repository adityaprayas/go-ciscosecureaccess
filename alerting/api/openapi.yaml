        {
            "alert_name": "alert number 50",
            "created_after": '2025-01-01T00:00:00Z'
        }
        ```
      explode: true
      in: query
      name: filters
      required: false
      schema:
        $ref: "#/components/schemas/filtersAlertObject"
      style: form
  requestBodies:
    TestNotificationsEmailRequestBody:
