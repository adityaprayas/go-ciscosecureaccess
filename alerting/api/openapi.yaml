      required: true
    UpdateStatusAlertRequestBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/updateAlertsStatus_request"
      required: true
    UpdateStatusAlertRuleRequestBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/updateAlertRulesStatus_request"
      required: true
