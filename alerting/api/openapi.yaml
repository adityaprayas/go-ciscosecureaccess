openapi: 3.0.0
info:
  contact:
    name: Cloud Security Developer Community
  description: Manage the alert rules in the organization and monitor the alerts generated
    by the alert rules.
  title: Cisco Secure Access Alerting API
  version: 1.0.0
servers:
- url: "https://api.sse.cisco.com/{basePath}"
  variables:
    basePath:
      default: admin/v2
security:
- oauthFlow: []
tags:
- name: Alert Rules
- name: Alerts
- name: Secure Access
paths:
