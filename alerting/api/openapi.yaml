            application/json:
              schema:
                $ref: "#/components/schemas/listAlertRules_404_response"
          description: Not Found
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            Date:
              $ref: "#/components/headers/Date"
        "422":
          content:
            application/json:
              example:
                error: "Bad Request, Maximum 50 email recipients allowed per rule,\
                  \ found 100"
              schema:
                $ref: "#/components/schemas/createAlertRule_422_response"
          description: Unprocessable Entity (Too many email recipients or webhooks
            in notification_info)
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            Date:
              $ref: "#/components/headers/Date"
        "429":
