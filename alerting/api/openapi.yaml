            conditions:
              match_type: all
              rows:
              - field: tunnelGroupName
                value: test2
              - field: region
                value: US West-2
          schema:
            $ref: "#/components/schemas/createAlertRule_request"
      required: true
    UpdateAlertRuleRequestBody:
