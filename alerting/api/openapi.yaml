  /alerting/alerts:
    get:
      description: Get the properties of the alerts for the organization.
      operationId: listAlerts
      parameters:
      - description: |-
          Filter the alerts by one or more properties.
          Specify the properties of the filters query parameter in the JSON format.

          Example:

          ```
          {
              "alert_name": "alert number 50",
              "created_after": '2025-01-01T00:00:00Z'
          }
          ```
        explode: true
        in: query
        name: filters
        required: false
        schema:
          $ref: "#/components/schemas/filtersAlertObject"
        style: form
      - description: The maximum number of items to return from the collection in
          the response.
        example: 5
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 10
          type: integer
        style: form
      - description: The place to start reading in the collection. The default offset
          is 0.
        example: 0
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int64
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                fullResponse:
                  $ref: "#/components/examples/fullResponse"
                fullResponseWithContext:
                  $ref: "#/components/examples/fullResponseWithContext"
                countOnly:
                  $ref: "#/components/examples/countOnly"
              schema:
