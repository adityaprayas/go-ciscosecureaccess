          example: Internal Server Error
          type: string
      type: object
  securitySchemes:
    oauthFlow:
      description: The client credential flow.
      flows:
        clientCredentials:
          scopes:
            policies.contentCategories:read: Read Content Category settings
          tokenUrl: https://api.sse.cisco.com/auth/v2/token
      type: oauth2
